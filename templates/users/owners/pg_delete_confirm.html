{% extends "base.html" %}
{% load static %}

{% block content %}
<section style="max-width: 720px; margin: 4rem auto 5rem; padding: 0 1rem;">
  <div style="background: white; border-radius: 24px; box-shadow: 0 18px 48px rgba(30,31,61,0.08); padding: 2rem; text-align:center;">
    <h1 style="margin-bottom: 1rem;">Delete PG Listing</h1>
    <p style="margin-bottom: 1.75rem; color:#475569;">Are you sure you want to delete <strong>{{ pg.title }}</strong>? This action cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" style="background:#dc2626; color:white; padding:.95rem 1.35rem; border:none; border-radius:14px; font-weight:700; width:100%; max-width:260px;">Yes, delete listing</button>
    </form>

    <a href="{% url 'owner_dashboard' %}?pg={{ pg.slug }}" style="display:inline-block; margin-top:1rem; color:#0f172a; text-decoration:none;">Cancel</a>
  </div>
</section>
{% endblock %}
